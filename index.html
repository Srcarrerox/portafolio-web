<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fernando Carrero — Portafolio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M9 7h14v3.2H12.6v4.4H21v3H12.6V25H9V7z' fill='%2385C528'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M9 7h14v3.2H12.6v4.4H21v3H12.6V25H9V7z' fill='%2385C528'/%3E%3C/svg%3E">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#85C528;--w:#fff;--k:#000;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:#000}
body{background:transparent;color:var(--w);font-family:'Montserrat',system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
#matrixBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
#matrixBg.on{opacity:.22}
footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:4px}
::selection{background:var(--g);color:var(--k)}
.wrap{padding:0 clamp(18px,4vw,56px);max-width:1400px;margin:0 auto}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,56px);mix-blend-mode:difference;font-size:14px;font-weight:600}
nav .links{display:flex;gap:clamp(20px,4vw,48px)}
.navblur{position:fixed;top:0;left:0;right:0;height:clamp(90px,10vw,130px);z-index:19;pointer-events:none}
.navblur i{position:absolute;inset:0}
.navblur i:nth-child(1){-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 100%)}
.navblur i:nth-child(2){-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 85%);mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 85%)}
.navblur i:nth-child(3){-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 30%,transparent 70%);mask-image:linear-gradient(to bottom,#000 0%,#000 30%,transparent 70%)}
.navblur i:nth-child(4){-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 15%,transparent 55%);mask-image:linear-gradient(to bottom,#000 0%,#000 15%,transparent 55%)}
nav .links{margin-right:100px}
#lang{position:fixed;top:12px;right:clamp(18px,4vw,56px);z-index:21;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
#lang:hover{background:rgba(255,255,255,.85);color:#000}

/* HERO */
.hero{--ph:86%;position:relative;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end;background:var(--w);color:var(--k)}
.hero h1{position:absolute;left:0;right:0;top:18%;text-align:center;font-weight:700;font-size:clamp(46px,13vw,220px);line-height:.94;letter-spacing:-.035em;z-index:1}
.hero .photo{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:var(--ph);width:auto;z-index:2;object-fit:contain;filter:grayscale(1) contrast(1.05)}
.hero .role{position:absolute;right:clamp(18px,4vw,56px);bottom:14%;z-index:4;text-align:right;font-weight:700;font-size:clamp(18px,3vw,48px);line-height:1;letter-spacing:-.02em;color:var(--g);white-space:nowrap}
.hero .role-left{position:absolute;left:clamp(18px,4vw,56px);bottom:14%;z-index:4;text-align:left;font-weight:700;font-size:clamp(18px,3vw,48px);line-height:1;letter-spacing:-.02em;color:var(--g);white-space:nowrap}
.hero .soc{position:absolute;left:0;right:0;bottom:5%;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(18px,4vw,56px);font-size:13px;font-weight:600}
.hero .soc a:hover{text-decoration:underline;text-decoration-color:var(--g);text-underline-offset:4px}
.hero .soc a.soc-center{color:#fff}
.hero .front{position:absolute;inset:0;z-index:3;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:auto var(--ph);mask-size:auto var(--ph);-webkit-mask-position:50% 100%;mask-position:50% 100%}
.hero .neg{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:difference}
.hero .neg h1{color:#fff}

/* SECTIONS — más aire */
section{position:relative;z-index:1;border-top:1px solid var(--line);padding:clamp(64px,10vw,130px) 0}
.tag{color:var(--g);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:clamp(20px,3vw,36px)}
.big{font-size:clamp(30px,4.8vw,64px);font-weight:600;line-height:1.08;letter-spacing:-.03em;max-width:18ch}
.big em{font-style:normal;color:var(--g)}

/* ABOUT — mejor balance */
.about{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(40px,6vw,80px);margin-top:clamp(28px,4vw,48px);align-items:start}
.about-text p{color:var(--dim);max-width:48ch;font-size:16px;line-height:1.65}
.about-text p + p{margin-top:16px}
.btn{display:inline-block;margin-top:28px;border:1px solid var(--g);color:var(--g);border-radius:99px;padding:11px 24px;font-size:14px;font-weight:600;transition:.2s}
.btn:hover{background:var(--g);color:var(--k)}

/* PARTÍCULAS */
.tools-label{color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.tools-zone{
  position:relative;width:100%;
  height:clamp(220px,32vw,300px);
  border:1px solid var(--line);border-radius:18px;
  background-color:#0a0a0a;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.3px);
  background-size:20px 20px;overflow:hidden;
}
.tools-zone canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.tool-tag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.35);pointer-events:none;transition:opacity .3s,transform .3s;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500}
.tool-tag.out{opacity:0;transform:translate(-50%,6px)}
.corner{position:absolute;width:10px;height:10px;border:1px solid rgba(133,197,40,.3);pointer-events:none}
.tl{top:10px;left:10px;border-right:0;border-bottom:0}
.tr{top:10px;right:10px;border-left:0;border-bottom:0}
.bl{bottom:10px;left:10px;border-right:0;border-top:0}
.br{bottom:10px;right:10px;border-left:0;border-top:0}
.tool-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tool-tab{appearance:none;background:rgba(255,255,255,.025);border:1px solid var(--line);color:rgba(255,255,255,.5);font:600 11px/1 'Montserrat',system-ui,sans-serif;letter-spacing:.3px;padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s,background .2s,box-shadow .2s}
.tool-tab:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.tool-tab.active{color:var(--g);border-color:var(--g);background:rgba(133,197,40,.08);box-shadow:0 0 14px rgba(133,197,40,.15)}

/* SERVICES — más compacto, 2 columnas */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:clamp(24px,3vw,40px)}
.svc-card{background:var(--k);padding:clamp(24px,3vw,36px);transition:background .2s}
.svc-card:hover{background:#0a0a0a}
.svc-card h3{font-size:clamp(17px,2vw,22px);font-weight:600;letter-spacing:-.015em;margin-bottom:10px;line-height:1.25}
.svc-card p{color:var(--dim);font-size:14px;line-height:1.55;max-width:42ch}

/* EXPERIENCE */
.exp{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(32px,5vw,72px);margin-top:clamp(24px,3vw,40px)}
.row{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row b{color:var(--g);font-weight:600;font-size:14px}
.row h3{font-size:clamp(17px,2vw,24px);font-weight:600;letter-spacing:-.015em;line-height:1.2;margin-bottom:6px}
.row p{color:var(--dim);font-size:14px;max-width:52ch;line-height:1.5}
.side h3{font-size:13px;font-weight:600;color:var(--g);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
.bar{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar+i{display:block;height:2px;background:var(--line);margin-bottom:14px}
.bar+i u{display:block;height:100%;background:var(--g)}
.attitudes{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.attitudes span{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}

/* WORK */
.project{margin-bottom:clamp(48px,7vw,90px)}
.project:last-child{margin-bottom:0}
.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;align-items:baseline}
.meta h3{font-size:clamp(22px,3vw,40px);font-weight:600;letter-spacing:-.02em}
.meta p{color:var(--dim);max-width:42ch;font-size:14px}
.fig{position:relative;overflow:hidden;background:#111;min-height:100px;border-radius:4px}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig.empty img{display:none}
.fig.empty::after{content:"// " attr(data-key);position:absolute;inset:0;display:grid;place-items:center;color:var(--g);font-size:12px;font-weight:600;border:1px dashed rgba(133,197,40,.4);border-radius:4px}
.grid{display:grid;gap:clamp(8px,1.1vw,14px)}
.g4{grid-template-columns:repeat(4,1fr)}.g4 .fig{aspect-ratio:3/4}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .fig{aspect-ratio:1}
.g2{grid-template-columns:repeat(2,1fr)}.g2 .fig{aspect-ratio:16/10}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.1vw,14px)}
.pair .fig{aspect-ratio:4/5}
.cap{font-size:12px;color:var(--dim);margin:7px 0 18px}
.prompt-set{margin-bottom:clamp(36px,5vw,64px)}
.prompt-set:last-child{margin-bottom:0}
.prompt-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  appearance:none;background:transparent;border:1px solid var(--g);color:var(--g);
  border-radius:99px;padding:9px 18px;font:600 13px/1 'Montserrat',system-ui,sans-serif;
  cursor:pointer;transition:background .2s,color .2s;
}
.prompt-btn:hover{background:var(--g);color:var(--k)}
.prompt-modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:20px;
}
.prompt-modal[hidden]{display:none}
.prompt-modal-box{
  width:min(92vw,640px);max-height:min(80vh,720px);display:flex;flex-direction:column;
  background:#0d0d0d;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.prompt-modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g);
}
.prompt-modal-head button{
  appearance:none;background:none;border:0;color:var(--dim);font-size:22px;line-height:1;
  cursor:pointer;padding:0 4px;
}
.prompt-modal-head button:hover{color:#fff}
.prompt-code{
  flex:1;overflow:auto;margin:0;padding:16px 18px;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:rgba(255,255,255,.82);white-space:pre-wrap;word-break:break-word;
  background:#0a0a0a;
}
.prompt-copy{
  margin:14px 18px 16px;appearance:none;border:0;border-radius:99px;
  background:var(--g);color:var(--k);font:700 13px/1 'Montserrat',system-ui,sans-serif;
  padding:12px 20px;cursor:pointer;transition:opacity .2s;
}
.prompt-copy:hover{opacity:.88}
.prompt-copy.ok{background:#fff}

/* CONTACT */
.contact a.mail{display:block;font-size:clamp(24px,5.2vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05;overflow-wrap:anywhere;transition:color .2s;margin-top:8px}
.contact a.mail:hover{color:var(--g)}
.info{display:flex;gap:clamp(20px,4vw,48px);flex-wrap:wrap;margin-top:32px;color:var(--dim);font-size:14px}
.info a:hover{color:var(--g)}
footer{padding:24px 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}

/* RESPONSIVE */
@media(max-width:900px){
  .about,.exp,.svc-grid{grid-template-columns:1fr}
  .svc-grid{gap:0}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr 1fr}
  .g2,.pair{grid-template-columns:1fr}
  /* HERO MOBILE: el escenario queda fijo para que la foto y sus efectos no salten */
  .hero{
    --ph:68%;
    height:100svh;
    min-height:100svh;
    max-height:100svh;
    isolation:isolate;
  }
  .hero h1{top:13%}
  nav .links{display:none}
  .tools-zone{height:clamp(210px,48vw,280px)}
  .row{grid-template-columns:1fr;gap:4px}
  /* Títulos centrados, uno debajo del otro en móvil */
  .hero .role,
  .hero .role-left{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    text-align:center;
    white-space:nowrap;
    font-size:clamp(16px,4.5vw,28px);
    max-width:92vw;
  }
  .hero .role{bottom:18%}       /* Diseñador arriba */
  .hero .role-left{bottom:13%}  /* Ingeniero abajo */
  .hero .soc{bottom:4%;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* MOBILE SAFE */
*{-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
nav{padding-top:calc(16px + env(safe-area-inset-top));padding-left:max(clamp(18px,4vw,56px),env(safe-area-inset-left));padding-right:max(clamp(18px,4vw,56px),env(safe-area-inset-right))}
#lang{top:calc(12px + env(safe-area-inset-top));right:max(clamp(18px,4vw,56px),env(safe-area-inset-right))}
.wrap{padding-left:max(clamp(18px,4vw,56px),env(safe-area-inset-left));padding-right:max(clamp(18px,4vw,56px),env(safe-area-inset-right))}
.hero .soc{padding-left:max(clamp(18px,4vw,56px),env(safe-area-inset-left));padding-right:max(clamp(18px,4vw,56px),env(safe-area-inset-right))}
.hero .role{right:max(clamp(18px,4vw,56px),env(safe-area-inset-right))}
.hero .role-left{left:max(clamp(18px,4vw,56px),env(safe-area-inset-left))}
.hero .photo{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
#gyro{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:20;background:var(--g);color:var(--k);border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
#gyro[hidden]{display:none}
#gyroMsg{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:20;width:max-content;max-width:min(86vw,340px);background:var(--k);color:var(--w);border-radius:14px;padding:10px 14px;font-size:12px;font-weight:600;line-height:1.4;text-align:center;cursor:pointer}
#gyroMsg[hidden]{display:none}
@media(max-width:900px){
  .hero .role,
  .hero .role-left{
    left:50% !important;
    right:auto !important;
    transform:translateX(-50%);
    text-align:center;
  }
}
@media(max-width:360px){
  .hero .role,.hero .role-left{font-size:15px}
  .hero .role{bottom:15.5%}
  .hero .role-left{bottom:11%}
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:10;display:none;pointer-events:none}

/* ===== PREMIUM INTERACTIONS ===== */
#spotlight{
  position:fixed;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(circle 280px at var(--sx,50%) var(--sy,50%),
    rgba(133,197,40,.07) 0%,
    rgba(133,197,40,.025) 35%,
    transparent 70%);
  opacity:0;transition:opacity .5s ease;
  mix-blend-mode:screen;
}
.magnetic{
  transition:transform .35s cubic-bezier(.23,1,.32,1);
  will-change:transform;
}
.tilt-card{
  transition:transform .4s cubic-bezier(.23,1,.32,1), box-shadow .4s ease;
  transform-style:preserve-3d;
  will-change:transform;
  border-radius:6px;
}
.tilt-card:hover{
  box-shadow:0 20px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(133,197,40,.12);
}
.svc-card{
  transition:background .25s, transform .35s cubic-bezier(.23,1,.32,1);
}

</style>
</head>
<body>
<canvas id="matrixBg" aria-hidden="true"></canvas>
<div id="spotlight" aria-hidden="true"></div>

<div class="navblur"><i></i><i></i><i></i><i></i></div>
<nav>
  <a href="#top">©Fernando Carrero</a>
  <div class="links"><a href="#proyectos" data-k="nav1"></a><a href="#servicios" data-k="nav2"></a><a href="#contacto" data-k="nav3"></a></div>
</nav>
<button id="lang" aria-label="Cambiar idioma | Change language">ES | EN</button>

<header class="hero" id="top">
  <div class="neg"><h1 id="wBack"></h1></div>
  <div class="fig" data-key="hero" style="position:absolute;inset:0;background:none;z-index:2;pointer-events:none">
    <img class="photo" data-img="hero" alt="Fernando Carrero">
  </div>
  <div class="front" id="front"></div>
  <div class="role-left" data-k="role2"></div>
  <div class="role" data-k="role1"></div>
  <div class="soc">
    <a href="mailto:facarreronava@gmail.com">Email</a>
    <a class="soc-center" href="https://www.behance.net/ffernando" target="_blank" rel="noopener">Behance</a>
    <a href="https://instagram.com/ferxdesing" target="_blank" rel="noopener">Instagram</a>
  </div>
  <button id="gyro" type="button" hidden data-k="gyro"></button>
  <div id="gyroMsg" hidden data-k="gyroOff"></div>
</header>

<!-- SOBRE MÍ -->
<section id="sobre">
  <div class="wrap">
    <div class="tag" data-k="tagAbout"></div>
    <p class="big" data-k="statement" data-html></p>
    <div class="about">
      <div class="about-text">
        <p data-k="about1"></p>
        <p data-k="about2"></p>
        <a class="btn magnetic" href="#proyectos" data-k="cta"></a>
      </div>
      <div>
        <div class="tools-label" data-k="toolsLabel"></div>
        <div class="tools-zone" id="zone">
          <canvas id="cv" role="img" aria-label="Herramientas"></canvas>
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div class="tool-tag" id="tag"></div>
        </div>
        <div class="tool-tabs" id="tabs"></div>
      </div>
    </div>
  </div>
</section>

<!-- SERVICIOS (más compacto) -->
<section id="servicios">
  <div class="wrap">
    <div class="tag" data-k="tagSvc"></div>
    <div class="svc-grid">
      <div class="svc-card"><h3 data-k="s1t"></h3><p data-k="s1d"></p></div>
      <div class="svc-card"><h3 data-k="s2t"></h3><p data-k="s2d"></p></div>
      <div class="svc-card"><h3 data-k="s3t"></h3><p data-k="s3d"></p></div>
      <div class="svc-card"><h3 data-k="s4t"></h3><p data-k="s4d"></p></div>
    </div>
  </div>

const LOOK_ORDER = ["derecha","abajo-derecha","abajo","abajo-izquierda","izquierda","arriba-izquierda","arriba","arriba-derecha"];
const LOOK_ORIGIN = { x: .5, y: .35 };

const LOOK_SCALE = {

};

if(IMG.hero){
  const photo = document.querySelector(".hero .photo"), front = document.getElementById("front");
  let cur = "centro", inCenter = true;
  Object.values(LOOK).forEach(src=>{ const i = new Image(); i.src = src; });
  const fit = k=>{
    // Mantener un único marco geométrico para todas las miradas.
    // Cambia únicamente el PNG; no cambia posición, tamaño ni máscara.
    const h = "var(--ph)";
    photo.style.height = h;
    photo.style.bottom = "0px";
    photo.style.left = "50%";
    photo.style.transform = "translateX(-50%)";
    front.style.webkitMaskSize = front.style.maskSize = "auto " + h;
    front.style.webkitMaskPosition = front.style.maskPosition = "50% 100%";
  };
  const setLook = k=>{
    if(k === cur) return; cur = k;
    photo.src = LOOK[k];
    const m = 'url("'+LOOK[k]+'")';
    front.style.webkitMaskImage = m; front.style.maskImage = m;
    fit(k);
  };
  fit("centro");
  const aim = (dx,dy,enter,leave)=>{
    const d = Math.hypot(dx,dy);
    if(inCenter && d > leave) inCenter = false;
    else if(!inCenter && d < enter) inCenter = true;
    setLook(inCenter ? "centro" : LOOK_ORDER[(Math.round(Math.atan2(dy,dx)/(Math.PI/4))+8)%8]);
  };
  const look = (x,y)=>{
    const r = photo.getBoundingClientRect();
    aim(x - (r.left + r.width*LOOK_ORIGIN.x), y - (r.top + r.height*LOOK_ORIGIN.y), LOOK_ENTER*r.height, LOOK_LEAVE*r.height);
  };
  window.addEventListener("pointermove", e=>{ if(e.pointerType !== "touch") look(e.clientX,e.clientY); });

  const GYRO_ENTER = 5, GYRO_LEAVE = 9;
  const GYRO_RANGE_X = 22, GYRO_RANGE_Y = 20;
  const GYRO_FLIP = { x:false, y:false };
  const gyroBtn = document.getElementById("gyro"), gyroMsg = document.getElementById("gyroMsg");
  let gyroOn = false, src = null, base = null, touchFallback = false, lastSensor = 0;

  const feed = (x,y)=>{
    const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    if(a === 90){ [x,y] = [y,-x]; }
    else if(a === 270 || a === -90){ [x,y] = [-y,x]; }
    else if(Math.abs(a) === 180){ [x,y] = [-x,-y]; }

    // La referencia se fija al empezar. Antes el código la perseguía
    // continuamente y eso hacía que x-base/y-base tendiera casi a cero.
    if(!base){
      base = { x, y };
      lastSensor = performance.now();
      return;
    }

    lastSensor = performance.now();

    // Diferencia respecto a la posición inicial, limitada para evitar saltos.
    const dx = Math.max(-GYRO_RANGE_X, Math.min(GYRO_RANGE_X, x - base.x));
    const dy = Math.max(-GYRO_RANGE_Y, Math.min(GYRO_RANGE_Y, y - base.y));

    aim(
      dx * (GYRO_FLIP.x ? -1 : 1),
      dy * (GYRO_FLIP.y ? -1 : 1),
      GYRO_ENTER,
      GYRO_LEAVE
    );
  };

    if(e.beta == null || e.gamma == null || (src && src !== name)) return;

    const g = e.accelerationIncludingGravity;
    if(!g || g.x == null || g.y == null || g.z == null || (src && src !== "motion")) return;
    src = "motion"; gyroMsg.hidden = true;
    feed(Math.atan2(-g.x, Math.hypot(g.y, g.z))*180/Math.PI, Math.atan2(g.y, g.z)*180/Math.PI);

    gyroBtn.hidden = false;
    gyroMsg.hidden = true;
    touchFallback = true;
  };
  const onTouch = e=>{ if(touchFallback && e.touches[0]) look(e.touches[0].clientX, e.touches[0].clientY); };

    try{

      }

         typeof DeviceMotionEvent.requestPermission === "function"){
        const p = await DeviceMotionEvent.requestPermission();
        if(p !== "granted"){ noSensor(); return; }
      }
    }catch(e){
      noSensor();
      return;
    }
    startGyro();
  });

  const startGyro = ()=>{
    gyroOn = true;
    gyroBtn.hidden = true;
    gyroMsg.hidden = true;
    touchFallback = false;
    base = null;
    src = null;

      return;

<script>
'use strict';
(() => {
  const TOOLS = [
    { name: 'Photoshop',        color: '#31A8FF', tag: 'Edición de imagen' },
    { name: 'After Effects',    color: '#A78BFA', tag: 'Motion graphics' },
    { name: 'Illustrator',      color: '#FF9A00', tag: 'Diseño vectorial' },
    { name: 'Lightroom',        color: '#9EC5FF', tag: 'Revelado y color' },
    { name: 'Midjourney',       color: '#F2B000', tag: 'IA generativa' },
    { name: 'Google iA Studio', color: '#FFFFFF', tag: 'IA generativa · local' },
    { name: 'Gemini',           color: '#7B9AFF', tag: 'Asistente IA' },
    { name: 'Claude',           color: '#D97757', tag: 'Asistente IA' },
  ];
  const DENSITY = 4, AUTOPLAY_MS = 4800, MOUSE_RADIUS = 75;
  const MAX_PARTICLES = innerWidth < 640 ? 1300 : 2600;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const zone = document.getElementById('zone'), cv = document.getElementById('cv');
  const ctx = cv.getContext('2d'), tag = document.getElementById('tag'), tabsEl = document.getElementById('tabs');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const rand = (a,b) => a + Math.random()*(b-a);
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  const sprites=new Map();
  function glowSprite(color){
    if(sprites.has(color)) return sprites.get(color);
    const s=document.createElement('canvas');s.width=s.height=32;const c=s.getContext('2d');
    const [r,g,b]=hexToRgb(color);
    const grad=c.createRadialGradient(16,16,0,16,16,16);
    grad.addColorStop(0,`rgba(${r},${g},${b},1)`);grad.addColorStop(0.3,`rgba(${r},${g},${b},.5)`);grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    c.fillStyle=grad;c.fillRect(0,0,32,32);sprites.set(color,s);return s;
  }
  const particles=[];
  function initParticles(){for(let i=0;i<MAX_PARTICLES;i++){particles.push({x:rand(0,W),y:rand(0,H),vx:0,vy:0,tx:0,ty:0,size:rand(0.85,2.2),phase:rand(0,Math.PI*2),delay:0,mode:'dust',img:null,dustA:rand(0.05,0.12)});}}
  const off=document.createElement('canvas'), octx=off.getContext('2d',{willReadFrequently:true});
  const FONT="'Space Grotesk',sans-serif";
  function layout(text){
    const fit=(lines)=>{octx.font=`700 100px ${FONT}`;const widest=Math.max(...lines.map(l=>octx.measureText(l).width));return Math.min(100*(W*0.88)/widest,(H*0.48)/(lines.length*1.08),130);};
    let lines=[text],size=fit(lines);
    if(size<50&&text.includes(' ')){const w=text.split(' '),m=Math.ceil(w.length/2);lines=[w.slice(0,m).join(' '),w.slice(m).join(' ')];size=fit(lines);}
    return {lines,size:Math.floor(size)};
  }
  function samplePoints(text){
    if(W<10||H<10) return [];
    off.width=W;off.height=H;
    if('letterSpacing' in octx) octx.letterSpacing='1.5px';
    const {lines,size}=layout(text);
    octx.font=`700 ${size}px ${FONT}`;octx.textAlign='center';octx.textBaseline='middle';
    const lh=size*1.08,y0=H/2-((lines.length-1)*lh)/2;
    lines.forEach((l,i)=>octx.fillText(l,W/2,y0+i*lh));
    const data=octx.getImageData(0,0,W,H).data,pts=[];
    for(let y=0;y<H;y+=DENSITY) for(let x=0;x<W;x+=DENSITY) if(data[(y*W+x)*4+3]>128) pts.push({x:x+rand(-1,1),y:y+rand(-1,1)});
    if(pts.length>MAX_PARTICLES){const step=Math.ceil(pts.length/MAX_PARTICLES);return pts.filter((_,i)=>i%step===0);}
    return pts;
  }
  let current=-1,linkRGB=[133,197,40];
  function morphTo(index,explode){
    current=index;const tool=TOOLS[index];linkRGB=hexToRgb(tool.color);
    const pts=shuffle(samplePoints(tool.name)),main=glowSprite(tool.color),white=glowSprite('#FFFFFF');
    particles.forEach((p,i)=>{
      p.delay=rand(3,20)|0;
      if(i<pts.length){p.mode='text';p.tx=pts[i].x;p.ty=pts[i].y;p.img=Math.random()<0.14?white:main;}
      else{p.mode='dust';p.img=main;}
      if(explode&&!REDUCED){const a=Math.atan2(p.y-H/2,p.x-W/2)+rand(-0.5,0.5),f=rand(4,11);p.vx+=Math.cos(a)*f;p.vy+=Math.sin(a)*f;}
    });
    [...tabsEl.children].forEach((b,i)=>b.classList.toggle('active',i===index));
    cv.setAttribute('aria-label',`${tool.name} — ${tool.tag}`);
    tag.classList.add('out');
    setTimeout(()=>{tag.textContent=tool.tag;tag.classList.remove('out');},250);
  }
  const mouse={x:-9e3,y:-9e3};
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  cv.addEventListener('pointerleave',()=>{mouse.x=mouse.y=-9e3;});
  let t=0;
  function frame(){
    t+=0.016;ctx.clearRect(0,0,W,H);drawLinks();ctx.globalCompositeOperation='lighter';
    for(const p of particles){
      if(p.delay>0) p.delay--;
      if(p.mode==='text'){if(p.delay===0){p.vx+=(p.tx-p.x)*0.025;p.vy+=(p.ty-p.y)*0.025;p.vx+=rand(-0.01,0.01);}}
      else{p.vy-=0.002;p.vx+=Math.sin(t*0.5+p.phase)*0.003;if(p.y<-12)p.y=H+12;if(p.x<-12)p.x=W+12;else if(p.x>W+12)p.x=-12;}
      const dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy;
      if(d2<MOUSE_RADIUS*MOUSE_RADIUS){const d=Math.sqrt(d2)||1,f=((MOUSE_RADIUS-d)/MOUSE_RADIUS)*0.8;p.vx+=(dx/d)*f;p.vy+=(dy/d)*f;}
      p.vx*=0.9;p.vy*=0.9;p.x+=p.vx;p.y+=p.vy;
      const breathe=0.8+0.2*Math.sin(t*2+p.phase),r=p.size*(p.mode==='text'?breathe:0.6)*2.2;
      ctx.globalAlpha=p.mode==='text'?0.88:p.dustA*0.5;
      ctx.drawImage(p.img,p.x-r,p.y-r,r*2,r*2);
    }
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;requestAnimationFrame(frame);
  }
  function drawLinks(){
    const cell=25,maxD=23,maxD2=maxD*maxD,grid=new Map(),act=[];
    for(const p of particles){if(p.mode!=='text')continue;act.push(p);const k=((p.x/cell)|0)+'_'+((p.y/cell)|0);let arr=grid.get(k);if(!arr)grid.set(k,arr=[]);arr.push(p);}
    const [r,g,b]=linkRGB;ctx.strokeStyle=`rgb(${r},${g},${b})`;ctx.lineWidth=1;let n=0;
    for(const p of act){if(n>750)break;const cx=(p.x/cell)|0,cy=(p.y/cell)|0;
      for(let ox=0;ox<=1;ox++)for(let oy=ox===0?0:-1;oy<=1;oy++){const arr=grid.get((cx+ox)+'_'+(cy+oy));if(!arr)continue;
        for(const q of arr){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
          if(d2<maxD2){ctx.globalAlpha=(1-Math.sqrt(d2)/maxD)*0.11;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();n++;}}}}
    ctx.globalAlpha=1;
  }
  let timer=null;
  function schedule(){clearTimeout(timer);timer=setTimeout(()=>{morphTo((current+1)%TOOLS.length,true);schedule();},AUTOPLAY_MS);}
  TOOLS.forEach((tool,i)=>{const b=document.createElement('button');b.className='tool-tab';b.type='button';b.textContent=tool.name;b.addEventListener('click',()=>{morphTo(i,true);schedule();});tabsEl.appendChild(b);});
  function resize(){const r=zone.getBoundingClientRect();W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(current>=0)morphTo(current,false);}
  addEventListener('resize',resize);
  requestAnimationFrame(()=>{resize();initParticles();morphTo(0,false);schedule();document.fonts?.ready.then(()=>morphTo(current,false));requestAnimationFrame(frame);});
})();
</script>

<script>
/* ============================================================
   PREMIUM INTERACTIONS — Spotlight + Magnetic + Soft Tilt
   Sutil, caro, 2025-2026
   ============================================================ */
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (matchMedia('(pointer: coarse)').matches) return; // skip on pure touch devices

  const spotlight = document.getElementById('spotlight');
  const sobre = document.getElementById('sobre');
  let active = false;
  let mx = innerWidth / 2, my = innerHeight / 2;
  let sx = mx, sy = my;

  /* ---------- SPOTLIGHT ---------- */
  function updateSpotlightPresence() {
    if (!sobre || !spotlight) return;
    const rect = sobre.getBoundingClientRect();
    const show = rect.top < innerHeight * 0.65;
    spotlight.style.opacity = show ? '1' : '0';
    active = show;
  }

  window.addEventListener('pointermove', e => {
    mx = e.clientX;
    my = e.clientY;
    if (active && spotlight) {
      // slight lag for premium feel
      sx += (mx - sx) * 0.18;
      sy += (my - sy) * 0.18;
      spotlight.style.setProperty('--sx', sx + 'px');
      spotlight.style.setProperty('--sy', sy + 'px');
    }
  }, { passive: true });

  // continuous smooth lag even when mouse stops
  (function lagLoop() {
    if (active && spotlight) {
      sx += (mx - sx) * 0.12;
      sy += (my - sy) * 0.12;
      spotlight.style.setProperty('--sx', sx + 'px');
      spotlight.style.setProperty('--sy', sy + 'px');
    }
    requestAnimationFrame(lagLoop);
  })();

  window.addEventListener('scroll', updateSpotlightPresence, { passive: true });
  updateSpotlightPresence();

  /* ---------- MAGNETIC ---------- */
  function makeMagnetic(el, strength = 0.35) {
    if (!el || el.dataset.magnetic) return;
    el.dataset.magnetic = '1';
    el.classList.add('magnetic');

    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = (e.clientX - cx) * strength;
      const dy = (e.clientY - cy) * strength;
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    el.addEventListener('pointerleave', () => {
      el.style.transform = 'translate(0, 0)';
    });
  }

  // Apply to existing + future buttons
  document.querySelectorAll('.btn, .tool-tab, .svc-card').forEach(el => makeMagnetic(el, el.classList.contains('svc-card') ? 0.18 : 0.32));

  // Watch for dynamically created tool-tabs
  const tabsObserver = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType === 1 && n.classList?.contains('tool-tab')) makeMagnetic(n, 0.32);
    }));
  });
  const tabsEl = document.getElementById('tabs');
  if (tabsEl) tabsObserver.observe(tabsEl, { childList: true });

  /* ---------- SOFT TILT on project images ---------- */
  function makeTilt(el) {
    if (!el || el.dataset.tilt) return;
    el.dataset.tilt = '1';
    el.classList.add('tilt-card');

    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;   // 0-1
      const py = (e.clientY - r.top) / r.height;
      const rx = (py - 0.5) * -8;  // max 8deg
      const ry = (px - 0.5) *  8;
      el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02,1.02,1.02)`;
    });

    el.addEventListener('pointerleave', () => {
      el.style.transform = 'perspective(900px) rotateX(0) rotateY(0) scale3d(1,1,1)';
    });
  }

  // Project images + service cards
  document.querySelectorAll('#proyectos .fig, .svc-card').forEach(makeTilt);

  // Also give a lighter magnetic to service cards (already done above)
})();
</script>

<!-- MATRIX RAIN BACKGROUND (desde Sobre mí) -->
<script>
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const canvas = document.getElementById('matrixBg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Portfolio green: #85C528
  const colors = { fg: [133, 197, 40], bg: [0, 0, 0], accent: [180, 255, 80] };
  function rgbaStr(c, a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  function thash(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  // Intensity / scale — sutil (~15-22% visible)
  const intensity = 42;
  const scale = 4.5;
  let t = 0;
  let active = false;

  function drawMatrix() {
    ctx.fillStyle = 'rgb(0,0,0)';
    ctx.fillRect(0, 0, W, H);

    const amp = intensity / 50;
    const fontSize = Math.max(12, Math.floor(10 + scale * 2.1));
    const colW = fontSize * 1.15; // un poco más de espacio entre columnas
    const cols = Math.ceil(W / colW) + 1;
    const chars = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÑñ¿?¡!@#$%';
    const trailMax = 6 + Math.floor(amp * 10);

    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textBaseline = 'top';

    for (let col = 0; col < cols; col++) {
      const speed = 1.1 + thash(col * 1.0) * 4.2;
      const trail = 3 + Math.floor(thash(col * 2.3) * trailMax);
      const offset = thash(col * 3.7) * H * 3;
      const x = col * colW;
      const totalH = H + trail * fontSize;
      const headY = ((t * speed * fontSize * amp * 0.42 + offset) % totalH);

      for (let i = 0; i < trail; i++) {
        const y = headY - i * fontSize;
        if (y < -fontSize || y > H) continue;

        const fade = 1 - i / trail;
        const alpha = fade * fade * 0.7;
        if (alpha < 0.05) continue;

        const ci = Math.floor(thash(col * 10 + i * 0.37 + Math.floor(t * 3.5) * 0.07) * chars.length);
        const ch = chars[ci % chars.length];

        ctx.save();
        if (i < 2) {
          ctx.shadowColor = rgbaStr(colors.accent, 0.55);
          ctx.shadowBlur = 8;
          ctx.fillStyle = rgbaStr(colors.accent, Math.min(0.95, alpha * 1.35));
        } else {
          ctx.shadowBlur = 0;
          ctx.fillStyle = rgbaStr(colors.fg, alpha);
        }
        ctx.fillText(ch, x, y);
        ctx.restore();
      }
    }
  }

  function frame() {
    if (active) {
      t += 0.016 * 1.4;
      drawMatrix();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Activar la lluvia al llegar a "Sobre mí"
  const sobre = document.getElementById('sobre');
  function updateVisibility() {
    if (!sobre) return;
    const rect = sobre.getBoundingClientRect();
    // Aparece cuando el top de sobre está cerca del viewport
    const shouldShow = rect.top < innerHeight * 0.85;
    if (shouldShow && !active) {
      active = true;
      canvas.classList.add('on');
    } else if (!shouldShow && active && scrollY < 50) {
      // Solo apaga si volvemos al top del hero
      active = false;
      canvas.classList.remove('on');
    }
  }
  addEventListener('scroll', updateVisibility, { passive: true });
  updateVisibility();
})();
</script>
